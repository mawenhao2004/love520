<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 生日快乐</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: #0f0f1a;
    color: #e0d6c2;
    font-family: 'Noto Serif SC', serif;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: default;
    user-select: none;
  }

  /* ===== 画布粒子层 ===== */
  #particles {
    position: fixed; top:0; left:0; width:100%; height:100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ===== 主容器 ===== */
  .main {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 40px 20px;
  }

  /* ===== 玻璃卡片 ===== */
  .glass-card {
    background: rgba(15,15,26,0.6);
    backdrop-filter: blur(20px) saturate(120%);
    -webkit-backdrop-filter: blur(20px) saturate(120%);
    border: 1px solid rgba(191,160,106,0.25);
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 700px;
    width: 100%;
    text-align: center;
    position: relative;
    box-shadow: 0 8px 48px rgba(191,160,106,0.08),
                inset 0 1px 0 rgba(191,160,106,0.1);
    animation: cardFloat 6s ease-in-out infinite;
  }

  @keyframes cardFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  /* ===== 顶部光环 ===== */
  .halo {
    position: absolute; top: -60px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(191,160,106,0.4) 0%, transparent 70%);
    animation: haloPulse 3s ease-in-out infinite;
  }
  @keyframes haloPulse {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }
    50% { transform: translateX(-50%) scale(1.3); opacity: 1; }
  }

  /* ===== 蛋糕图标 ===== */
  .cake-icon {
    font-size: 72px;
    margin-bottom: 8px;
    animation: bounce 2s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-10px) rotate(-3deg); }
    75% { transform: translateY(-10px) rotate(3deg); }
  }

  /* ===== 标题 ===== */
  .title {
    font-size: 48px;
    font-weight: 900;
    background: linear-gradient(135deg, #bfa06a 0%, #f0d78c 50%, #d4a84b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 16px 0 8px;
    letter-spacing: 4px;
  }

  .subtitle {
    font-size: 20px;
    color: #bfa06a;
    font-weight: 400;
    margin-bottom: 32px;
    opacity: 0.8;
    letter-spacing: 2px;
  }

  /* ===== 打字机祝福 ===== */
  .typed-text {
    font-size: 22px;
    line-height: 2.2;
    color: #d4c5a9;
    min-height: 40px;
    font-weight: 400;
  }
  .typed-text .cursor {
    display: inline-block;
    width: 2px; height: 24px;
    background: #bfa06a;
    margin-left: 2px;
    animation: blink 0.8s infinite;
    vertical-align: middle;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  /* ===== 蜡烛区 ===== */
  .candles {
    display: flex; justify-content: center;
    gap: 24px; margin: 40px 0;
    flex-wrap: wrap;
  }
  .candle {
    position: relative;
    width: 28px; height: 70px;
    cursor: pointer;
    transition: transform 0.3s;
  }
  .candle:hover { transform: scale(1.15); }
  .candle-body {
    width: 100%; height: 50px;
    background: linear-gradient(180deg, #f5e6d3 0%, #e8c9a0 100%);
    border-radius: 6px 6px 3px 3px;
    box-shadow: inset 0 4px 8px rgba(0,0,0,0.1);
    position: relative;
  }
  .candle-body::after {
    content: '';
    position: absolute; top: -2px; left: 50%;
    transform: translateX(-50%);
    width: 2px; height: 16px;
    background: #333;
    border-radius: 1px;
  }
  .candle-flame {
    position: absolute; top: -22px; left: 50%;
    transform: translateX(-50%);
    width: 14px; height: 22px;
    background: radial-gradient(ellipse at center, #fff 0%, #ffd700 35%, #ff8c00 80%, transparent 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flameFlicker 0.3s ease-in-out infinite;
    filter: drop-shadow(0 0 8px #ffa500);
  }
  @keyframes flameFlicker {
    0%, 100% { transform: translateX(-50%) scale(1,1); }
    25% { transform: translateX(-45%) scale(1.1,0.9); }
    50% { transform: translateX(-55%) scale(0.9,1.2); }
    75% { transform: translateX(-48%) scale(1.05,1); }
  }
  .candle-number {
    position: absolute; bottom: -28px; left: 50%;
    transform: translateX(-50%);
    color: #bfa06a;
    font-size: 14px;
    font-weight: 700;
  }
  .candle.blown .candle-flame { display: none; }
  .candle.blown .candle-body::after { opacity: 0.3; }
  .candle.blown { opacity: 0.7; }

  /* ===== 金色按钮 ===== */
  .btn-gold {
    position: relative;
    display: inline-block;
    padding: 14px 40px;
    font-size: 18px;
    font-family: inherit;
    font-weight: 700;
    color: #0f0f1a;
    background: linear-gradient(135deg, #bfa06a 0%, #d4a84b 100%);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.4s;
    letter-spacing: 2px;
    box-shadow: 0 4px 20px rgba(191,160,106,0.3);
    margin: 24px 8px;
  }
  .btn-gold::after {
    content: '';
    position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s;
  }
  .btn-gold:hover::after { left: 100%; }
  .btn-gold:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(191,160,106,0.5);
  }
  .btn-gold:active { transform: scale(0.95); }

  /* ===== 烟花爆炸层 ===== */
  #firework-canvas {
    position: fixed; top:0; left:0; width:100%; height:100%;
    z-index: 2; pointer-events: none;
  }

  /* ===== 飘落花瓣 ===== */
  .petal {
    position: fixed;
    pointer-events: none;
    z-index: 3;
    font-size: 24px;
    animation: petalFall linear forwards;
  }
  @keyframes petalFall {
    0% { opacity: 1; transform: translate(0,0) rotate(0deg) scale(1); }
    50% { opacity: 0.8; transform: translate(60px, 40vh) rotate(180deg) scale(0.7); }
    100% { opacity: 0; transform: translate(-20px, 100vh) rotate(360deg) scale(0.3); }
  }

  /* ===== 祝福卡片列表 ===== */
  .wish-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-top: 40px;
    width: 100%;
  }
  .wish-card {
    background: rgba(191,160,106,0.08);
    border: 1px solid rgba(191,160,106,0.15);
    border-radius: 16px;
    padding: 24px 16px;
    text-align: center;
    transition: all 0.4s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .wish-card:hover {
    background: rgba(191,160,106,0.16);
    border-color: rgba(191,160,106,0.4);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(191,160,106,0.15);
  }
  .wish-icon { font-size: 36px; margin-bottom: 12px; }
  .wish-text {
    color: #c4b598;
    font-size: 15px;
    line-height: 1.8;
  }

  /* ===== 底部 ===== */
  .footer {
    margin-top: 48px;
    color: rgba(191,160,106,0.4);
    font-size: 13px;
    letter-spacing: 1px;
    text-align: center;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 600px) {
    .glass-card { padding: 32px 20px; }
    .title { font-size: 36px; }
    .typed-text { font-size: 17px; }
    .cake-icon { font-size: 52px; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>
<canvas id="firework-canvas"></canvas>

<div class="main">

  <div class="glass-card">
    <div class="halo"></div>

    <div class="cake-icon">🎂</div>
    <h1 class="title">生日快乐</h1>
    <p class="subtitle">✦ HAPPY BIRTHDAY ✦</p>

    <div class="typed-text" id="typed">
      <span id="typed-content"></span><span class="cursor"></span>
    </div>

    <div class="candles" id="candles">
      <!-- JS动态生成蜡烛 -->
    </div>
    <p style="color:rgba(191,160,106,0.6); font-size:13px; margin-top:-12px;">
      🕯️ 点击蜡烛许愿吧
    </p>

    <button class="btn-gold" onclick="launchFireworks()">✨ 放烟花</button>

    <div class="wish-grid">
      <div class="wish-card">
        <div class="wish-icon">🌟</div>
        <div class="wish-text">愿你眼里有光<br>心中有爱</div>
      </div>
      <div class="wish-card">
        <div class="wish-icon">💰</div>
        <div class="wish-text">暴富暴美<br>钱包鼓鼓</div>
      </div>
      <div class="wish-card">
        <div class="wish-icon">💪</div>
        <div class="wish-text">身体健康<br>万事顺遂</div>
      </div>
      <div class="wish-card">
        <div class="wish-icon">🎯</div>
        <div class="wish-text">所愿皆成<br>奔赴山海</div>
      </div>
    </div>
  </div>

  <div class="footer">
    愿你的每一天都如今天般灿烂 ✨
  </div>
</div>

<script>
// ==================== 粒子背景 ====================
const pCanvas = document.getElementById('particles');
const pCtx = pCanvas.getContext('2d');
let pW, pH, particles = [];

function resizeP() {
  pW = pCanvas.width = window.innerWidth;
  pH = pCanvas.height = window.innerHeight;
}
resizeP();
window.addEventListener('resize', resizeP);

class Particle {
  constructor() {
    this.reset();
    this.y = Math.random() * pH;
  }
  reset() {
    this.x = Math.random() * pW;
    this.y = -10;
    this.size = Math.random() * 2 + 0.5;
    this.speed = Math.random() * 0.6 + 0.2;
    this.opacity = Math.random() * 0.5 + 0.2;
    this.hue = Math.random() * 30 + 35; // gold-ish range
    this.drift = (Math.random() - 0.5) * 0.3;
  }
  update() {
    this.y += this.speed;
    this.x += this.drift;
    if (this.y > pH + 10) this.reset();
  }
  draw() {
    pCtx.beginPath();
    pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    pCtx.fillStyle = `hsla(${this.hue}, 70%, 75%, ${this.opacity})`;
    pCtx.fill();
  }
}

for (let i = 0; i < 120; i++) {
  particles.push(new Particle());
  particles[i].y = Math.random() * pH;
}

function animateParticles() {
  pCtx.clearRect(0, 0, pW, pH);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ==================== 打字机效果 ====================
const messages = [
  '愿你的笑容，像今天的阳光一样灿烂 🌞',
  '愿你被这个世界温柔以待 🤗',
  '愿你想要的都拥有，得不到的都释怀 💫',
  '愿你在新的一岁里，遇见更好的自己 🦋',
  '愿每一天醒来，都觉得人间值得 🌸',
  '愿你所行皆坦途，所遇皆良人 💖',
  '愿你永远保持热爱，奔赴下一场山海 🗻',
];
let msgIdx = 0, charIdx = 0, isDeleting = false;
const contentEl = document.getElementById('typed-content');

function typeLoop() {
  const msg = messages[msgIdx];
  if (!isDeleting) {
    charIdx++;
    contentEl.textContent = msg.substring(0, charIdx);
    if (charIdx >= msg.length) { isDeleting = true; setTimeout(typeLoop, 2500); return; }
    setTimeout(typeLoop, 80 + Math.random() * 60);
  } else {
    charIdx--;
    contentEl.textContent = msg.substring(0, charIdx);
    if (charIdx <= 0) {
      isDeleting = false;
      msgIdx = (msgIdx + 1) % messages.length;
      setTimeout(typeLoop, 400);
      return;
    }
    setTimeout(typeLoop, 30);
  }
}
typeLoop();

// ==================== 蜡烛 ====================
const candlesContainer = document.getElementById('candles');
const candleColors = ['#f5e6d3','#ffe4e1','#fff0db','#fce4d8','#fef5e7',
                      '#fae3d9','#fdf2e9','#f5ebe0','#fdebd0','#f9e79f'];
let totalCandles = 0;
let blownCount = 0;
let birthdayAge = 18; // 默认，可通过 URL 参数 ?age=xx 设置

// 读取URL参数中的年龄
const params = new URLSearchParams(window.location.search);
if (params.get('age')) birthdayAge = parseInt(params.get('age'));

function createCandles() {
  const count = birthdayAge > 30 ? 30 : birthdayAge;
  totalCandles = count;
  blownCount = 0;
  candlesContainer.innerHTML = '';

  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'candle';
    c.innerHTML = `
      <div class="candle-flame"></div>
      <div class="candle-body" style="background:linear-gradient(180deg, ${candleColors[i%candleColors.length]} 0%, ${candleColors[(i+1)%candleColors.length]} 100%);"></div>
      <div class="candle-number">${i+1}</div>
    `;
    c.addEventListener('click', () => blowCandle(c, i+1));
    candlesContainer.appendChild(c);
  }
}
createCandles();

function blowCandle(el, num) {
  if (el.classList.contains('blown')) return;
  el.classList.add('blown');
  blownCount++;

  // 吹灭时的小粒子效果
  spawnSparkles(el);

  if (blownCount === totalCandles) {
    setTimeout(() => {
      launchFireworks();
      setTimeout(dropPetals, 500);
    }, 400);
  }
}

function spawnSparkles(el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top;
  for (let i=0; i<12; i++) {
    const spark = document.createElement('div');
    spark.style.cssText = `
      position:fixed; pointer-events:none; z-index:4;
      left:${cx}px; top:${cy}px;
      width:4px; height:4px;
      background:hsl(${35+Math.random()*20}, 80%, ${60+Math.random()*30}%);
      border-radius:50%;
      transition: all 0.8s cubic-bezier(0.25,0.46,0.45,0.94);
      opacity:1;
    `;
    document.body.appendChild(spark);
    const angle = (Math.PI*2 * i) / 12;
    const dist = 30 + Math.random() * 50;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 20;
    spark.style.transform = `translate(${dx}px, ${dy}px) scale(0)`;
    spark.style.opacity = '0';
    setTimeout(() => spark.remove(), 900);
  }
}

// ==================== 烟花 ====================
const fwCanvas = document.getElementById('firework-canvas');
const fwCtx = fwCanvas.getContext('2d');
let fwW, fwH;

function resizeFW() {
  fwW = fwCanvas.width = window.innerWidth;
  fwH = fwCanvas.height = window.innerHeight;
}
resizeFW();
window.addEventListener('resize', resizeFW);

class FireworkParticle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 6 + 3;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.alpha = 1;
    this.decay = Math.random() * 0.02 + 0.012;
    this.gravity = 0.06;
    this.size = Math.random() * 3 + 1;
  }
  update() {
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.decay;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

let fwParticles = [];
const fwColors = ['#bfa06a','#ffd700','#ff6b6b','#ff9f43','#feca57',
                   '#ff6348','#e8a0bf','#ffc312','#f0d78c','#d4a84b',
                   '#ff7979','#f9ca24','#c7ecee','#7ed6df','#e056a0'];

function launchFireworks() {
  const bursts = 5 + Math.floor(Math.random() * 5);
  for (let b = 0; b < bursts; b++) {
    setTimeout(() => {
      const x = fwW * 0.2 + Math.random() * fwW * 0.6;
      const y = fwH * 0.2 + Math.random() * fwH * 0.35;
      const color = fwColors[Math.floor(Math.random() * fwColors.length)];
      for (let i = 0; i < 60; i++) {
        fwParticles.push(new FireworkParticle(x, y, color));
      }
    }, b * 200);
  }
}

function animateFW() {
  fwCtx.clearRect(0, 0, fwW, fwH);
  fwParticles = fwParticles.filter(p => p.alpha > 0);
  fwParticles.forEach(p => { p.update(); p.draw(fwCtx); });
  requestAnimationFrame(animateFW);
}
animateFW();

// 自动放一波
setTimeout(launchFireworks, 1500);

// ==================== 飘落花瓣 ====================
const petalEmojis = ['🌸','🌺','💐','🌷','🌼','💮','🏵️','🌻','✿','❀'];

function dropPetals() {
  for (let i=0; i<30; i++) {
    setTimeout(() => {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.textContent = petalEmojis[Math.floor(Math.random()*petalEmojis.length)];
      petal.style.left = Math.random() * window.innerWidth + 'px';
      petal.style.top = -(20 + Math.random() * 40) + 'px';
      petal.style.animationDuration = (3 + Math.random() * 5) + 's';
      petal.style.fontSize = (18 + Math.random() * 28) + 'px';
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), 8000);
    }, i * 120);
  }
}

// 点击空白处也撒花瓣
document.addEventListener('click', (e) => {
  if (e.target.tagName === 'BODY' || e.target.classList.contains('main')) {
    dropPetals();
  }
});
</script>

</body>
</html>
