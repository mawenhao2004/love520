<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>520 · 告白</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;600;700;900&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg: #0a0a14;
    --gold: #c9a87c;
    --gold-light: #e8d5b5;
    --gold-warm: #b8946b;
    --rose: #d4a0a0;
    --text: #e8dcc8;
    --text-dim: #9a9080;
    --glass: rgba(12,10,22,0.55);
  }

  body {
    background: var(--bg);
    font-family: 'Noto Serif SC', serif;
    overflow-x: hidden;
    min-height: 100vh; min-height: 100dvh;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== 星空画布 ===== */
  #starsCanvas {
    position: fixed; top:0; left:0; width:100%; height:100%;
    z-index: 0; pointer-events: none;
  }

  /* ===== 场景容器 ===== */
  .scene {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10;
    transition: opacity 1.5s ease, transform 1.5s ease;
  }
  .scene.hidden { opacity: 0; transform: scale(1.1); pointer-events: none; }

  /* ===== 玻璃卡片 ===== */
  .card {
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(120%);
    -webkit-backdrop-filter: blur(24px) saturate(120%);
    border: 1px solid rgba(201,168,124,0.2);
    border-radius: 28px;
    padding: 52px 44px;
    max-width: 620px;
    width: 90%;
    text-align: center;
    position: relative;
    box-shadow: 0 8px 56px rgba(201,168,124,0.06),
                inset 0 1px 0 rgba(201,168,124,0.08);
    animation: floatCard 7s ease-in-out infinite;
  }
  @keyframes floatCard {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .card-ring {
    position: absolute; inset: -1px;
    border-radius: 28px;
    background: linear-gradient(135deg, rgba(201,168,124,0.3), transparent 40%, transparent 60%, rgba(201,168,124,0.15));
    pointer-events: none;
    z-index: -1;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    -webkit-mask-composite: xor;
    padding: 1px;
  }

  /* ===== 场景1 - 开场 ===== */
  .big-heart {
    font-size: 80px;
    display: inline-block;
    animation: heartbeat 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(255,100,120,0.4));
  }
  @keyframes heartbeat {
    0%, 30% { transform: scale(1); }
    15% { transform: scale(1.25); }
    45% { transform: scale(1); }
  }

  .title-520 {
    font-size: 88px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--rose) 0%, var(--gold-light) 40%, var(--rose) 80%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s ease infinite;
    line-height: 1;
    margin: 16px 0 8px;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 18px;
    letter-spacing: 6px;
    font-weight: 300;
    margin-bottom: 6px;
  }

  .hint {
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 2px;
    margin-top: 28px;
    opacity: 0.5;
    animation: fadeHint 2s ease-in-out infinite;
  }
  @keyframes fadeHint {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }

  /* ===== 打字文本 ===== */
  .typed-wrap {
    font-size: 20px;
    line-height: 2;
    color: var(--text);
    min-height: 48px;
    font-weight: 400;
    margin: 20px 0;
  }
  .typed-wrap .cursor {
    display: inline-block; width: 2px; height: 22px;
    background: var(--gold); margin-left: 3px;
    animation: blink 0.7s infinite; vertical-align: middle;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  /* ===== 按钮 ===== */
  .btn {
    display: inline-block;
    padding: 14px 44px;
    font-size: 17px;
    font-family: inherit;
    font-weight: 700;
    color: #0a0a14;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-warm) 100%);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    letter-spacing: 2px;
    box-shadow: 0 4px 24px rgba(201,168,124,0.3);
    margin: 20px 0 8px;
    transition: all 0.4s;
  }
  .btn::after {
    content: '';
    position: absolute; top:0; left:-100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transition: left 0.5s;
  }
  .btn:hover::after { left: 100%; }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 36px rgba(201,168,124,0.45); }
  .btn:active { transform: scale(0.95); }

  /* ===== 爱心飘落 ===== */
  .floating-heart {
    position: fixed; pointer-events: none; z-index: 15;
    font-size: 22px;
    animation: heartFloat linear forwards;
    filter: drop-shadow(0 0 8px rgba(255,130,150,0.3));
  }
  @keyframes heartFloat {
    0% { opacity: 1; transform: translate(0,0) rotate(0deg) scale(1); }
    50% { opacity: 0.7; transform: translate(40px, 30vh) rotate(90deg) scale(0.6); }
    100% { opacity: 0; transform: translate(-10px, 100vh) rotate(200deg) scale(0.2); }
  }

  /* ===== 场景2 - 告白 ===== */
  .love-lines p {
    font-size: 19px;
    color: var(--text);
    line-height: 2.4;
    margin: 4px 0;
    letter-spacing: 1px;
    opacity: 0;
    animation: lineIn 0.6s ease forwards;
  }
  .love-lines p:nth-child(1) { animation-delay: 0.3s; }
  .love-lines p:nth-child(2) { animation-delay: 0.9s; }
  .love-lines p:nth-child(3) { animation-delay: 1.5s; }
  .love-lines p:nth-child(4) { animation-delay: 2.1s; }
  .love-lines p:nth-child(5) { animation-delay: 2.7s; }

  @keyframes lineIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .highlight {
    color: var(--gold-light);
    font-weight: 700;
  }

  /* ===== 场景3 - 结尾 ===== */
  .big-520-final {
    font-size: 96px;
    font-weight: 900;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #ff9a9e, var(--gold-light));
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: finalShimmer 2s ease infinite;
    line-height: 1;
  }
  @keyframes finalShimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .signature {
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 3px;
    margin-top: 20px;
    opacity: 0.6;
  }

  /* ===== 爱心烟花 ===== */
  #burstCanvas {
    position: fixed; top:0; left:0; width:100%; height:100%;
    z-index: 20; pointer-events: none;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 480px) {
    .card { padding: 36px 24px; border-radius: 22px; }
    .title-520 { font-size: 64px; }
    .big-heart { font-size: 56px; }
    .love-lines p { font-size: 16px; }
    .big-520-final { font-size: 68px; }
  }
</style>
</head>
<body>

<canvas id="starsCanvas"></canvas>
<canvas id="burstCanvas"></canvas>

<!-- ====== 场景1：开场 ====== -->
<div class="scene" id="scene1">
  <div class="card">
    <div class="card-ring"></div>
    <div class="big-heart">💖</div>
    <div class="title-520">520</div>
    <div class="subtitle">✦ 我 爱 你 ✦</div>
    <div class="typed-wrap">
      <span id="typedContent"></span><span class="cursor"></span>
    </div>
    <button class="btn" onclick="nextScene()">💌 打开告白信</button>
    <div class="hint">点击卡片进入</div>
  </div>
</div>

<!-- ====== 场景2：告白信 ====== -->
<div class="scene hidden" id="scene2">
  <div class="card">
    <div class="card-ring"></div>
    <div class="love-lines">
      <p>在这个世界上，<span class="highlight">七十亿人</span>中遇见你</p>
      <p>是我一生中<span class="highlight">最幸运的事</span></p>
      <p>你的笑容，是我每天<span class="highlight">最期待的光</span></p>
      <p>你的名字，是我心底<span class="highlight">最温柔的诗</span></p>
      <p>我想和你，走过<span class="highlight">每一个春夏秋冬</span></p>
    </div>
    <button class="btn" onclick="nextScene()">💝 收下我的心意</button>
  </div>
</div>

<!-- ====== 场景3：结尾 ====== -->
<div class="scene hidden" id="scene3">
  <div class="card">
    <div class="card-ring"></div>
    <div class="big-heart" style="font-size:64px;">💕</div>
    <div class="big-520-final">520</div>
    <div class="subtitle" style="margin-top:8px;">我爱你</div>
    <p style="color:var(--text);font-size:16px;margin-top:20px;line-height:2;">
      愿每一天<span class="highlight">都和今天一样甜</span><br>
      愿每一个梦<span class="highlight">都有彼此的身影</span>
    </p>
    <button class="btn" onclick="replayAll()">🔄 再看一遍</button>
    <div class="signature">— 致 我 最 爱 的 你 —</div>
  </div>
</div>

<script>
// ==================== 星空背景 ====================
const starsCanvas = document.getElementById('starsCanvas');
const starsCtx = starsCanvas.getContext('2d');
let SW, SH, stars = [];

function resizeStars() {
  SW = starsCanvas.width = window.innerWidth;
  SH = starsCanvas.height = window.innerHeight;
}
resizeStars();
window.addEventListener('resize', resizeStars);

class Star {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * SW;
    this.y = init ? Math.random() * SH : -5;
    this.size = Math.random() * 2 + 0.3;
    this.brightness = Math.random() * 0.6 + 0.3;
    this.twinkleSpeed = Math.random() * 0.02 + 0.005;
    this.twinkleOffset = Math.random() * Math.PI * 2;
    this.drift = (Math.random() - 0.5) * 0.2;
  }
  update() {
    this.y += 0.15 + this.size * 0.1;
    this.x += this.drift;
    if (this.y > SH + 10) this.reset(false);
  }
  draw(t) {
    const alpha = this.brightness + Math.sin(t * this.twinkleSpeed + this.twinkleOffset) * 0.2;
    starsCtx.beginPath();
    starsCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    starsCtx.fillStyle = `rgba(220,200,180,${Math.max(0.05, alpha)})`;
    starsCtx.fill();
  }
}

for (let i = 0; i < 200; i++) stars.push(new Star());

function animateStars(t) {
  starsCtx.clearRect(0, 0, SW, SH);
  stars.forEach(s => { s.update(); s.draw(t); });

  // 偶尔画流星
  if (Math.random() < 0.008) {
    const mx = Math.random() * SW * 0.8;
    const my = Math.random() * SH * 0.3;
    starsCtx.strokeStyle = 'rgba(220,200,180,0.6)';
    starsCtx.lineWidth = 1.5;
    starsCtx.beginPath();
    starsCtx.moveTo(mx, my);
    starsCtx.lineTo(mx + 80, my + 40);
    starsCtx.stroke();
  }
  requestAnimationFrame(animateStars);
}
requestAnimationFrame(animateStars);

// ==================== 打字效果 ====================
const typedLines = [
  '遇见的概率是千万分之一',
  '心动的概率是不可计算',
  '而爱你，是百分百确定',
];
let lineIdx = 0, charIdx = 0, deleting = false;
const typedEl = document.getElementById('typedContent');

function typeLoop() {
  const line = typedLines[lineIdx];
  if (!deleting) {
    charIdx++;
    typedEl.textContent = line.substring(0, charIdx);
    if (charIdx >= line.length) { deleting = true; setTimeout(typeLoop, 2200); return; }
    setTimeout(typeLoop, 70 + Math.random() * 50);
  } else {
    charIdx--;
    typedEl.textContent = line.substring(0, charIdx);
    if (charIdx <= 0) {
      deleting = false;
      lineIdx = (lineIdx + 1) % typedLines.length;
      setTimeout(typeLoop, 400);
      return;
    }
    setTimeout(typeLoop, 25);
  }
}
typeLoop();

// ==================== 场景切换 ====================
let currentScene = 1;

function nextScene() {
  const current = document.getElementById('scene' + currentScene);
  current.classList.add('hidden');

  currentScene++;
  if (currentScene > 3) currentScene = 3;

  const next = document.getElementById('scene' + currentScene);
  next.classList.remove('hidden');

  if (currentScene === 2) launchBurst();

  // 爱心飘落
  for (let i = 0; i < 12; i++) {
    setTimeout(() => spawnHeart(), i * 80);
  }
}

function replayAll() {
  document.getElementById('scene3').classList.add('hidden');
  document.getElementById('scene1').classList.remove('hidden');
  currentScene = 1;
  launchBurst();
}

// ==================== 爱心飘落 ====================
const hearts = ['❤️','💕','💗','💖','💝','💘','💓','🩷','♥️','💞'];

function spawnHeart() {
  const h = document.createElement('div');
  h.className = 'floating-heart';
  h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
  h.style.left = Math.random() * window.innerWidth + 'px';
  h.style.top = -(20 + Math.random() * 60) + 'px';
  h.style.animationDuration = (3 + Math.random() * 5) + 's';
  h.style.fontSize = (16 + Math.random() * 24) + 'px';
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 8000);
}

// 点击空白飘爱心
document.addEventListener('click', (e) => {
  if (e.target.tagName === 'BODY' || e.target.classList.contains('scene')) {
    for (let i = 0; i < 6; i++) setTimeout(() => spawnHeart(), i * 60);
  }
});

// ==================== 爱心粒子爆发 ====================
const burstCanvas = document.getElementById('burstCanvas');
const burstCtx = burstCanvas.getContext('2d');
let BW, BH;

function resizeBurst() {
  BW = burstCanvas.width = window.innerWidth;
  BH = burstCanvas.height = window.innerHeight;
}
resizeBurst();
window.addEventListener('resize', resizeBurst);

class BurstParticle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.alpha = 1;
    this.decay = Math.random() * 0.015 + 0.008;
    this.gravity = 0.05;
    this.size = Math.random() * 4 + 1.5;
  }
  update() {
    this.vx *= 0.98; this.vy *= 0.98;
    this.vy += this.gravity;
    this.x += this.vx; this.y += this.vy;
    this.alpha -= this.decay;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

let burstParticles = [];
const burstColors = ['#ff9a9e','#fad0c4','#c9a87c','#e8d5b5','#ff6b6b',
                      '#d4a0a0','#ff9999','#ffb3b3','#ffc3a0','#fecfef'];

function launchBurst() {
  for (let b = 0; b < 3; b++) {
    setTimeout(() => {
      const bx = BW * 0.25 + Math.random() * BW * 0.5;
      const by = BH * 0.25 + Math.random() * BH * 0.3;
      const color = burstColors[Math.floor(Math.random() * burstColors.length)];
      for (let i = 0; i < 40; i++) {
        burstParticles.push(new BurstParticle(bx, by, color));
      }
    }, b * 150);
  }
}

function animateBurst() {
  burstCtx.clearRect(0, 0, BW, BH);
  burstParticles = burstParticles.filter(p => p.alpha > 0);
  burstParticles.forEach(p => { p.update(); p.draw(burstCtx); });
  requestAnimationFrame(animateBurst);
}
animateBurst();

// 开场自动放一波
setTimeout(launchBurst, 800);

// 卡片点击也能触发场景切换
document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    nextScene();
  });
});
</script>
</body>
</html>
